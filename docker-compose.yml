# Ambiente de desenvolvimento. Usuário e senha abaixo são apenas para uso local.
name: netshopgarden

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: netshopgarden
      POSTGRES_PASSWORD: netshopgarden
      POSTGRES_DB: netshopgarden
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netshopgarden -d netshopgarden"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Recebe todos os e-mails enviados pelo sistema. Interface em http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # Opcional, para testar o provider S3 localmente: docker compose --profile storage up -d
  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: netshopgarden
      MINIO_ROOT_PASSWORD: netshopgarden
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
